http:
  routers:
    control:
      rule: Host(`control.example.invalid`)
      service: control
      tls: {}
    plain:
      rule: Host(`plain.example.invalid`)
      service: image
  services:
    control:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:1337
    image:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8190
