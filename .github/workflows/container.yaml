name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        name: Validate Source Version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('pyproject.toml must contain an exact semantic version.')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('The release tag must match pyproject.toml.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY

  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [check:source, test:deployment, test:node, test:python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node node@24 npm:renovate oxfmt python ruff shellcheck uv
      - name: Run Checks
        run: mise run "${{ matrix.task }}"

  build:
    name: Build & Smoke ${{ matrix.architecture }}
    needs: prepare
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Image For Verification
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=ai-control-${{ matrix.architecture }}
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=gha,mode=max,scope=ai-control-{0},ignore-error=true', matrix.architecture) || '' }}
          context: .
          load: true
          platforms: linux/${{ matrix.architecture }}
          tags: ai-control:test
      - name: Smoke-Test Runtime
        run: python3 scripts/check_image.py ai-control:test
      - if: needs.prepare.outputs.publish == 'true'
        name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      # Reuses the verified layers from the builder's cache and pushes them untagged.
      - id: push
        if: needs.prepare.outputs.publish == 'true'
        name: Push Verified Image By Digest
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/${{ matrix.architecture }}
          provenance: mode=max
          sbom: true
      - if: needs.prepare.outputs.publish == 'true'
        name: Record Verified Digest
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$ARCHITECTURE"
      - if: needs.prepare.outputs.publish == 'true'
        name: Upload Verified Digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.architecture }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish Verified Manifest
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Verified Digests
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: digests
          pattern: digest-*
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Promote Both Verified Architectures
        env:
          SOURCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set --
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            set -- --tag "$IMAGE_NAME:$SOURCE_VERSION"
          else
            set -- --tag "$IMAGE_NAME:latest" --tag "$IMAGE_NAME:sha-$GITHUB_SHA"
          fi
          for architecture in amd64 arm64; do
            digest=$(cat "digests/$architecture")
            set -- "$@" "$IMAGE_NAME@$digest"
          done
          docker buildx imagetools create "$@"

  check:
    if: always()
    name: Check
    runs-on: ubuntu-latest
    needs: [checks, prepare, build, publish]
    steps:
      - name: Verify Checks, Builds & Publishing
        run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
